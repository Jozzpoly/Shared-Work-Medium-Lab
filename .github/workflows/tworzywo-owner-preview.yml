name: Tworzywo isolated Owner-preview specimen
on:
  push:
    branches:
      - experiment/tworzywo-owner-preview-2026-10-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specimen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact public Jaskinia and Feniks Studio revisions
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch experiment/tworzywo-construction https://github.com/Jozzpoly/Feniks-Studio.git studio
          git -C studio checkout --quiet --detach 2cc9677bb482c58997d6b1adcad4308dbd64298f
          git clone --quiet --single-branch --branch v6-materialy https://github.com/Jozzpoly/Jozz-Cave-Workbench.git jaskinia
          git -C jaskinia checkout --quiet --detach dd47f3253dbcf522b4cd671c794599d32cbe79b9
          test "$(git -C studio rev-parse HEAD)" = '2cc9677bb482c58997d6b1adcad4308dbd64298f'
          test "$(git -C jaskinia rev-parse HEAD)" = 'dd47f3253dbcf522b4cd671c794599d32cbe79b9'
      - name: Qualify Tworzywo core and build standalone HTML
        shell: bash
        env:
          JASKINIA_REPO: ${{ github.workspace }}/jaskinia
        run: |
          set -euo pipefail
          cd studio/experiments/material-as-construction
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -s tworzywo-probe.html
          grep -q 'TWORZYWO' tworzywo-probe.html
          sha256sum tworzywo-probe.html
      - name: Run real browser tests on isolated localhost
        shell: bash
        env:
          JASKINIA_REPO: ${{ github.workspace }}/jaskinia
        run: |
          set -euo pipefail
          cd studio/experiments/material-as-construction
          npx playwright install --with-deps chromium
          node serve.mjs > owner-preview-server.log 2>&1 &
          probe_pid=$!
          trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if [ -s server.json ]; then break; fi
            sleep .5
          done
          test -s server.json || { cat owner-preview-server.log; exit 1; }
          npm run test:browser
      - name: Prepare artifact with explicit provenance and limits
        if: always()
        shell: bash
        run: |
          mkdir -p delivery
          cat > delivery/README.txt <<'TXT'
          Tworzywo / isolated research specimen. NOT Owner-accepted; NOT production Jaskinia.
          Feniks-Studio commit: 2cc9677bb482c58997d6b1adcad4308dbd64298f
          Jaskinia v6.3 commit: dd47f3253dbcf522b4cd671c794599d32cbe79b9
          Contains only public repository code and synthetic test fixtures, not Owner data.
          Open tworzywo-probe.html in a modern browser. If file:// storage is unavailable,
          serve the HTML on an isolated localhost HTTP origin.
          The Tworzywo window opens automatically. Select Modele próbne.
          Passing automated tests DOES NOT prove useful authoring for the Owner.
          TXT
          if [ -s studio/experiments/material-as-construction/tworzywo-probe.html ]; then
            cp studio/experiments/material-as-construction/tworzywo-probe.html delivery/tworzywo-probe.html
            sha256sum delivery/tworzywo-probe.html > delivery/SHA256SUMS.txt
          fi
          if [ -s studio/experiments/material-as-construction/verification.json ]; then
            cp studio/experiments/material-as-construction/verification.json delivery/verification.json
          fi
      - name: Upload unmerged isolated downloadable build (NO deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tworzywo-review-standalone
          path: delivery/
          if-no-files-found: warn
          retention-days: 14

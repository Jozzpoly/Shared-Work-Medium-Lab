name: Open Substrate campaign

on:
  push:
    branches:
      - campaign/open-substrate-2026-10-04
    paths:
      - "campaigns/open-substrate-2026-10-04/**"
      - "campaigns/quiet-presence-2026-10-04/**"
      - ".github/workflows/open-substrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve Quiet Presence regression baseline
        run: |
          python campaigns/quiet-presence-2026-10-04/render.py
          python campaigns/quiet-presence-2026-10-04/verify.py

      - name: Characterize legacy Quiet Presence closure
        run: python campaigns/open-substrate-2026-10-04/baseline_probe.py

      - name: Preserve specimen 001 legacy-closure characterization
        run: python campaigns/open-substrate-2026-10-04/specimen1_probe.py --mode current

      - name: Render explicit-reference packages
        run: |
          python campaigns/open-substrate-2026-10-04/open_render.py \
            --package campaigns/open-substrate-2026-10-04/fixtures/specimen-001 \
            --package campaigns/open-substrate-2026-10-04/fixtures/specimen-002 \
            --package campaigns/open-substrate-2026-10-04/fixtures/specimen-003

      - name: Verify specimen 001 generic object fallback
        run: python campaigns/open-substrate-2026-10-04/open_verify.py

      - name: Verify independent record package
        run: python campaigns/open-substrate-2026-10-04/open_verify_records.py

      - name: Verify explicit reference boundary
        run: python campaigns/open-substrate-2026-10-04/open_verify_refs.py

      - name: Pressure invalid explicit references
        run: python campaigns/open-substrate-2026-10-04/reference_boundary_probe.py

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-substrate-evidence
          path: |
            campaigns/open-substrate-2026-10-04/baseline.json
            campaigns/open-substrate-2026-10-04/specimen1-current.json
            campaigns/open-substrate-2026-10-04/specimen2-current-frozen.json
            campaigns/open-substrate-2026-10-04/specimen3-current-frozen.json
            campaigns/open-substrate-2026-10-04/open-verification.json
            campaigns/open-substrate-2026-10-04/reference-verification.json
            campaigns/open-substrate-2026-10-04/reference-boundary-negative.json
            campaigns/open-substrate-2026-10-04/record-verification.json
            campaigns/open-substrate-2026-10-04/site/
            campaigns/quiet-presence-2026-10-04/verification.json
          retention-days: 14

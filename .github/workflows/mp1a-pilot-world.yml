name: MP-1A generated pilot world

on:
  push:
    branches:
      - experiment/mp1a-pilot-world-generator
    paths:
      - "experiments/mp1a-pilot-world/**"
      - ".github/workflows/mp1a-pilot-world.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp1a-pilot-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apparatus dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install browsergym-core pillow
          python -m playwright install chromium

      - name: Generate pilot world twice
        run: |
          python experiments/mp1a-pilot-world/generate_pilot.py --out experiments/mp1a-pilot-world/out
          python experiments/mp1a-pilot-world/generate_pilot.py --out experiments/mp1a-pilot-world/out-repeat

      - name: Require deterministic generation
        run: diff -qr experiments/mp1a-pilot-world/out experiments/mp1a-pilot-world/out-repeat

      - name: Generate navigable pilot world twice
        run: |
          python experiments/mp1a-pilot-world/generate_navigable_pilot.py --out experiments/mp1a-pilot-world/out-nav
          python experiments/mp1a-pilot-world/generate_navigable_pilot.py --out experiments/mp1a-pilot-world/out-nav-repeat

      - name: Require deterministic navigable generation
        run: diff -qr experiments/mp1a-pilot-world/out-nav experiments/mp1a-pilot-world/out-nav-repeat

      - name: Capture runtime
        run: |
          mkdir -p experiments/mp1a-pilot-world/artifacts
          mkdir -p experiments/mp1a-pilot-world/artifacts-nav
          python -m pip freeze > experiments/mp1a-pilot-world/artifacts/pip-freeze.txt
          python --version > experiments/mp1a-pilot-world/artifacts/runtime.txt

      - name: Verify canonical world and P0/P1 parity
        run: python experiments/mp1a-pilot-world/verify_pilot.py

      - name: Verify navigable acquisition world and per-page parity
        run: python experiments/mp1a-pilot-world/verify_navigable_pilot.py

      - name: Validate BrowserGym interaction loop and trace capture
        run: python experiments/mp1a-pilot-world/validate_interaction_loop.py

      - name: Validate external subject process boundary
        run: python experiments/mp1a-pilot-world/validate_subject_boundary.py

      - name: Validate real BrowserGym T1 trace to scorer bridge
        run: python experiments/mp1a-pilot-world/validate_real_trace_scoring.py

      - name: Self-test fail-closed OpenAI subject adapter without credentials
        run: python experiments/mp1a-pilot-world/openai_subject_adapter.py --self-test

      - name: Validate scoring seam on deterministic synthetic traces
        run: python experiments/mp1a-pilot-world/score_synthetic.py

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp1a-generated-pilot-world-evidence
          path: |
            experiments/mp1a-pilot-world/artifacts/
            experiments/mp1a-pilot-world/artifacts-nav/
            experiments/mp1a-pilot-world/out/
            experiments/mp1a-pilot-world/out-nav/
          if-no-files-found: warn
          retention-days: 14

name: Medium observation boundary falsifier

on:
  push:
    branches:
      - experiment/observation-boundary-falsifier-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - name: Reproduce source-truth failures and validate native baseline
        run: node --test experiments/observation-boundary-falsifier-2026-10-10/*.test.mjs experiments/observation-boundary-falsifier-2026-10-10/cloudflare-probe/*.test.mjs
      - name: Generate both source views from one read
        run: node experiments/observation-boundary-falsifier-2026-10-10/native-baseline.mjs /tmp/swm-source-navigation
      - name: Simulate actual Cloudflare root-directory deploy without publishing
        run: npx --yes wrangler@4.149.0 deploy --dry-run
      - name: Qualify real Cloudflare HTTP response and cache headers (non-gating)
        continue-on-error: true
        timeout-minutes: 2
        run: node experiments/observation-boundary-falsifier-2026-10-10/cloudflare-probe/live-qualification.mjs https://swm-medium-observation-probe.jozzpoly.workers.dev/

      - name: Qualify moving main source identity without inventing a Git revision (non-gating)
        continue-on-error: true
        timeout-minutes: 2
        run: node experiments/observation-boundary-falsifier-2026-10-10/cloudflare-probe/moving-qualification.mjs https://swm-medium-observation-probe.jozzpoly.workers.dev/

<!doctype html><html lang="pl"><meta charset="utf-8"><title>E2h · wybór części spod spodu</title>
<style>body{font:14px/1.4 system-ui;background:#0b1a24;color:#edf3f5;padding:15px}
pre{white-space:pre-wrap;background:#19333f;padding:12px;border-radius:8px}
iframe{width:100%;max-width:1000px;height:510px;border:1px solid #587482}</style>
<h2>E2h — widoczna część, cykliczny wybór i dalsze operacje</h2><p>Rzeczywisty kod E2e, import i syntetyczne gesty na canvas. Weryfikuje możliwość pracy na częściach nakładających się, nie ergonomię prawdziwego dotyku.</p>
<pre id="result" role="status">Start…</pre><iframe id="app" src="./e2e-material-workshop.html" title="Warsztat"></iframe>
<script>
(async()=>{
const status=document.getElementById('result'),tests=[],
check=(name,yes)=>{tests.push([name,!!yes]);if(!yes)throw Error('FAIL '+name)},
near=(a,b)=>Math.abs(a-b)<1e-6;
try{
const f=document.getElementById('app');await new Promise((ok,bad)=>{if(f.contentWindow?.E2E?.model)return ok();f.addEventListener('load',ok,{once:true});setTimeout(()=>bad(Error('Timeout')),12000)});
const w=f.contentWindow,d=w.document,a=w.E2E,canvas=d.getElementById('stage');canvas.setPointerCapture=()=>{};
const src={schema:'medium.material-workshop.v0',parts:[
{id:1,kind:'box',x:4,y:3,w:3,h:1.6,angle:0,pinned:false},
{id:2,kind:'disc',x:4,y:3,w:.6,h:.6,angle:0,pinned:false}],joints:[]};
function ev(type,x,y){
 const r=canvas.getBoundingClientRect(),s=Math.min(r.width/12,r.height/7.3),ox=(r.width-12*s)/2,oy=(r.height-7.3*s)/2;
 canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,button:0,pointerId:79,pointerType:'touch',clientX:r.left+ox+x*s,clientY:r.top+oy+y*s}))
}
async function importDoc(v){
 const input=d.getElementById('import'),file=new w.File([JSON.stringify(v)],'overlap.json',{type:'application/json'}),dt=new w.DataTransfer();
 dt.items.add(file);input.files=dt.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,120))
}
const sel=()=>d.getElementById('part-actions').classList.contains('on'),
btn=d.getElementById('cyclePick'),part=id=>a.doc.parts.find(x=>x.id===id);
await importDoc(src);
check('obydwa ciała są realnie w tych samych współrzędnych',a.doc.parts.length===2&&near(part(1).x,part(2).x));
check('topmost hit wskazuje ostatni narysowany obiekt',a.hit({x:4,y:3})===2);
check('obszar dużej bryły poza małą pozostaje wybieralny',a.hit({x:5.3,y:3})===1);
a.setMode('move');ev('pointerdown',4,3);ev('pointerup',4,3);
check('kliknięcie nakładania wybiera widoczne koło',sel()&&!btn.hidden&&btn.textContent.includes('1/2'));
btn.click();
check('jawny kontekstowy cykl trafień przełącza na belkę pod spodem',btn.textContent.includes('2/2'));
ev('pointerdown',4,3);ev('pointermove',5,3);ev('pointerup',5,3);
check('po cyklu można rzeczywiście przesunąć zakrytą bryłę',near(part(1).x,5)&&near(part(2).x,4));
a.undo();
check('undo cofa zmianę zakrytej bryły bez utraty pozostałych części',near(part(1).x,4)&&near(part(2).x,4));
a.setMode('move');ev('pointerdown',4,3);ev('pointerup',4,3);btn.click();
a.setMode('hinge');ev('pointerdown',4,3);ev('pointerdown',2,1);
check('wcześniej jawnie wybrana zakryta bryła jest celem tworzenia zawiasu',a.doc.joints.length===1&&a.doc.joints[0].b===1&&a.doc.joints[0].a===null);
await importDoc(src);a.setMode('move');ev('pointerdown',4,3);ev('pointerup',4,3);btn.click();a.setMode('delete');ev('pointerdown',4,3);
check('można świadomie usunąć zakrytą bryłę po jej wskazaniu',a.doc.parts.length===1&&a.doc.parts[0].id===2);
a.undo();
check('undo po usunięciu przywraca oba nakładające się obiekty',a.doc.parts.length===2);
const triple=JSON.parse(JSON.stringify(src));triple.parts.push({...triple.parts[1],id:3});
await importDoc(triple);check('najwyższa warstwa dwóch identycznych małych części wybierana pierwsza',a.hit({x:4,y:3})===3);
a.setMode('move');ev('pointerdown',4,3);ev('pointerup',4,3);
check('trzy trafienia ujawniają 1/3',btn.textContent.includes('1/3'));
btn.click();check('druga zakryta tarcza jest osiągalna',btn.textContent.includes('2/3'));
btn.click();check('najgłębsza belka jest również osiągalna',btn.textContent.includes('3/3'));
btn.click();check('wybór obiektów cyklicznie wraca na wierzch',btn.textContent.includes('1/3'));
status.textContent=JSON.stringify({status:'PASS',checks:tests.length,coverage:'topmost pick, contextual selection of two/three overlapping objects, drag, hinge, deletion, undo',limits:'synthetic touch-type pointer; no physical phone or Owner usability decision'},null,2)+'\n'+tests.map(([t])=>'✓ '+t).join('\n');
}catch(e){status.textContent='FAIL '+String(e.stack||e)+'\n'+tests.map(([n,y])=>(y?'✓ ':'✗ ')+n).join('\n')}
})();
</script></html>

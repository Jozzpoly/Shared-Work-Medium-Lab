<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medium • browser E2E</title>
<style>body{margin:0;background:#111823;color:#daeade;font:16px/1.5 system-ui}main{padding:24px;max-width:1100px;margin:auto}pre{padding:16px;border:1px solid #465a6b;white-space:pre-wrap;background:#11141a}iframe{width:100%;height:650px;border:1px solid #53758a;border-radius:8px}strong{color:#b0eed1}</style></head><body><main>
<h1>Library — browser-level end-to-end qualification</h1>
<p>Celowo izolowana strona testowa. Przy otwarciu wykonuje żądania tylko do PUBLICZNEGO GitHuba (testuje cztery karty); nie jest częścią zwykłego wejścia do biblioteki.</p>
<p id="status" role="status"><strong>START</strong> — loading exact library source</p>
<pre id="log" aria-label="wyniki kroków testu"></pre>
<iframe id="frame" title="Rzeczywisty HTML biblioteki w ramce testowej"></iframe></main>
<script>
(async function(){
const status=document.getElementById('status'),out=document.getElementById('log'),frame=document.getElementById('frame'),log=[];
const write=s=>{log.push(s);out.textContent=log.join('\n');};
const check=(b,message)=>{if(!b)throw Error('ASSERT FAIL: '+message);write('PASS: '+message);};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
const url='https://raw.githubusercontent.com/Jozzpoly/Shared-Work-Medium-Lab/fa898d72014928dcd3db3c3f86533e1164737d7c/experiments/library-field-shelf-2026-10-09/index.html';
const res=await fetch(url,{cache:'no-store'});
check(res.ok,'pinned library HTML network response');
const markup=await res.text();
check(markup.includes('data-repo="Jozzpoly/ReflexBrain-Lab"'),'on-branch source descriptor exists');
frame.srcdoc=markup;
await new Promise((resolve,reject)=>{frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(Error('iframe timeout')),7000)});
const doc=frame.contentDocument,win=frame.contentWindow;
check(!!doc,'same-origin srcdoc and active runtime');
check(doc.querySelectorAll('.project').length===4,'four real project cards');
check(doc.querySelectorAll('.peek').length===4,'four accessible native source-peek sections');
check(doc.querySelectorAll('.peek-receipt').length===4,'four exact-SHA receipt targets');
check(doc.querySelectorAll('.actions a').length===10,'ten native source/action or visit links');
const allLinks=Array.from(doc.querySelectorAll('.actions a')).map(a=>a.href);
check(allLinks.some(x=>x.includes('/ReflexBrain-Lab/probes/owner-field-lab.html')),'playable Reflex field has explicit action door');
check(allLinks.some(x=>x==='https://jozzpoly.github.io/Combat-Lab/'),'neutral Combat smoke has separate honest action door');
check(allLinks.some(x=>x.endsWith('/Jozz-Universal-Rig-Editor#run')),'JURE local run instruction distinguished from web demo');
const input=doc.getElementById('find'),cards=Array.from(doc.querySelectorAll('.project')),none=doc.getElementById('none');
check(cards[2].textContent.includes('jednym z kilku równoległych torów badań'),'Reflex selected branch is not misrepresented as entire laboratory');
const change=value=>{input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}))};
change('reflex');
check(cards.filter(x=>!x.hidden).length===1 && !cards[2].hidden,'search finds ReflexBrain without collapsing other source identities');
change('NEVER_EXISTS_PROJECT_123');
check(cards.every(x=>x.hidden)&&!none.hidden,'uncovered subject reports missing in four-card selection, not global absence');
change('');
check(cards.every(x=>!x.hidden)&&none.hidden,'search reset restores voluntary panorama');
const panels=Array.from(doc.querySelectorAll('.peek'));
for(let i=0;i<panels.length;i++){
 const p=panels[i],button=p.querySelector('.peek-read'),receipt=p.querySelector('.peek-receipt'),output=p.querySelector('.peek-output'),meta=output.querySelector('.meta');
 p.open=true;button.click();
 let elapsed=0;
 while(button.disabled && elapsed<14500){await wait(200);elapsed+=200}
 check(!button.disabled,'source '+(i+1)+' fetch eventually returned');
 check(!output.hidden,'source '+(i+1)+' exposes result/failure locally');
 if(receipt.hidden)throw Error('source '+(i+1)+' failed to obtain pinned receipt: '+meta.textContent);
 check(/^https:\/\/github.com\/Jozzpoly\/.+\/blob\/[a-f0-9]{40}\/.+$/.test(receipt.href),'source '+(i+1)+' SHA receipt is first-party, immutable and correctly shaped');
 check(output.querySelector('pre').textContent.length>25,'source '+(i+1)+' retained real document text');
 const select=p.querySelector('.peek-sections');
 check(!p.querySelector('.peek-select-label').hidden && select.options.length>1,'source '+(i+1)+' offers source-derived section navigation');
 if(i===2){
   const step=Array.from(select.options).find(x=>x.textContent.includes('Current next move'));
   check(!!step,'Reflex source contains its non-introductory next-move section');
   select.value=step.value; select.dispatchEvent(new win.Event('change',{bubbles:true}));
   check(output.querySelector('pre').textContent.startsWith('## Current next move'),'deep source selection shows original text, not a generated summary');
   check(receipt.href.endsWith('#L'+(Number(step.value)+1)),'deep section changes pinned Github link to exact original line');
 }
}
change('RECOVERY QUARANTINE');
check(cards.every(x=>x.hidden)&&!none.hidden,'search cannot silently change after loading source previews');
change('jure');
check(cards.filter(x=>!x.hidden).length===1&&!cards[3].hidden,'curated project search remains stable after source loads');
const firstText=panels[0].querySelector('.peek-output');
check(firstText.querySelector('pre').getAttribute('tabindex')==='0','long source preview can receive keyboard focus');
check(firstText.querySelector('.meta').getAttribute('aria-live')==='polite','only concise metadata has an accessibility announcement');
check(!firstText.hasAttribute('aria-live'),'long raw source does not announce itself automatically');
frame.style.width='390px';
await wait(220);
const grid=doc.querySelector('.grid'),columns=win.getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/);
check(columns.length===1,'narrow 390px frame reduces project grid to one column');
check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,'narrow viewport has no horizontal overflow');
change('');
check(cards.every(x=>!x.hidden),'desktop view check starts with visible cards, not a filtered-away element');
frame.style.width='1024px';await wait(350);
const viewButton=doc.getElementById('view-toggle');
check(viewButton?.getAttribute('aria-pressed')==='false','overview defaults to expanded readable mode');
viewButton.click();
check(doc.getElementById('cards').classList.contains('compact')&&viewButton.getAttribute('aria-pressed')==='true','compact view is deliberate and accessible');
write('Desktop probe: iframe.innerWidth='+win.innerWidth+' computed='+win.getComputedStyle(cards[0]).display);
check(win.getComputedStyle(cards[0]).display==='grid','compact view uses real two-dimensional project rows');
viewButton.click();
check(!doc.getElementById('cards').classList.contains('compact')&&viewButton.getAttribute('aria-pressed')==='false','expanded mode is reversible without losing source state');
// One deliberate browser-level inaccessible-source case. It modifies only the
// ephemeral test iframe (never the real published Library source).
const anchor='data-repo="Jozzpoly/Shared-Work-Medium-Lab"';
check(markup.includes(anchor),'negative control can isolate one source descriptor');
const negativeFrame=document.createElement('iframe');
negativeFrame.setAttribute('title','Niedostępne źródło — negatywna kontrola');
negativeFrame.style.cssText='position:absolute;left:-10000px;top:0;width:375px;height:5px';
document.body.appendChild(negativeFrame);
negativeFrame.srcdoc=markup.replace(anchor,'data-repo="Jozzpoly/Medium-Nonexistent-Probe-20261009"');
await new Promise((resolve,reject)=>{negativeFrame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(Error('negative iframe timeout')),7000)});
const badDoc=negativeFrame.contentDocument,badPanel=badDoc.querySelector('.peek');
check(!!badPanel,'negative reader boots without privileged source credentials');
badPanel.open=true;
const badButton=badPanel.querySelector('.peek-read');
badButton.click();
let badElapsed=0;
while(badButton.disabled&&badElapsed<10500){await wait(200);badElapsed+=200}
check(!badButton.disabled,'negative reader exits failed request without stalling');
check(badPanel.querySelector('.peek-output .meta').textContent.includes('Nie udało'),'negative reader clearly reports source access failure');
check(badPanel.querySelector('.peek-receipt').hidden,'negative reader does not invent an immutable source receipt');
check(badPanel.querySelector('.peek-select-label').hidden,'negative reader does not expose made-up source sections');
check(!!badPanel.querySelector('.peek-note a[href^="https://github.com/"]'),'source-native fallback remains available after failure');
negativeFrame.remove();
status.textContent='PASS — 4/4 exact-SHA receipts + 5/5 deterministic search transitions + 4 source outlines + verified action doors + real unavailable-source fallback + two view modes';
}catch(error){write('FAIL: '+String(error));status.textContent='FAIL — '+String(error)}
})();
</script></body></html>

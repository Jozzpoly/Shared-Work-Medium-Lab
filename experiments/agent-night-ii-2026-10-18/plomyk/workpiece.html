<!doctype html>
<html lang="pl">

<title>POLE X — uczciwa niepewność gestu</title>
<style>

<body>
<canvas id="scene" aria-label="Interaktywne pole sił. Przesuwaj kolorowe kręgi, stukaj w nie, aby zmienić kierunek siły. Przytrzymaj przy iskrach, by je chwycić. Krótki gest wypuszcza nowe iskry."></canvas>
<header><div><h1>POLE</h1><p>Kręgi: przesuń lub dotknij.</p></div><small>MAŁA ZABAWKA SIŁ</small></header>
<footer><div class="hint">Przytrzymaj iskry i rzuć. Szybki gest: nowe.</div><div class="controls"><button id="sound" type="button" aria-pressed="false">DŹW. WYŁ.</button><button id="reset" type="button">RESET</button></div></footer>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});

let W=0,H=0,dpr=1,clock=0,seed=91271,particles=[],magnets=[],ripples=[],pointerState=new Map(),audio=null,sound=false,frames=0,lastThrow=null,throwFlash=null;

const distance=(x,y,a,b)=>Math.hypot(x-a,y-b);
const palette={plus:[255,193,106],minus:[92,219,229]};
function resize(){
 const oldW=W,oldH=H; W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);dpr=Math.min(devicePixelRatio||1,2);

 if(oldW&&oldH){for(const m of magnets){m.x=clamp(m.x*W/oldW,38,W-38);m.y=clamp(m.y*H/oldH,120,H-70)}for(const p of particles){p.x*=W/oldW;p.y*=H/oldH;for(const t of p.trail){t.x*=W/oldW;t.y*=H/oldH}}}
}
function setup(){
 seed=91271;clock=0;frames=0;particles=[];ripples=[];pointerState.clear();lastThrow=null;throwFlash=null;
 magnets=[{x:W*.23,y:H*.39,polarity:1,id:0,pulse:0},{x:W*.77,y:H*.39,polarity:-1,id:1,pulse:0},{x:W*.50,y:H*.73,polarity:1,id:2,pulse:0}];
 for(let i=0;i<27;i++){const a=i*Math.PI*2/27,r=22+rand()*55;addParticle(W*.5+Math.cos(a)*r,H*.51+Math.sin(a)*r,Math.cos(a)*(.5+rand())*165,Math.sin(a)*(.5+rand())*165)}
}
function addParticle(x,y,vx,vy){if(particles.length>=90)particles.shift();particles.push({x,y,vx,vy,r:2.2+rand()*1.6,trail:[],hue:rand(),age:0})}

  const a=angle+(rand()-.5)*.32,v=speed*(.78+rand()*.36),offset=(rand()-.5)*20;
  addParticle(x+Math.cos(angle+Math.PI/2)*offset,y+Math.sin(angle+Math.PI/2)*offset,Math.cos(a)*v,Math.sin(a)*v);
 }
 ripples.push({x,y,t:0,color:'230,220,172'});
 tone(300+speed*.55,.12,.06);
}
function burst(x,y,n=8){for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=80+rand()*190;addParticle(x,y,Math.cos(a)*s,Math.sin(a)*s)}ripples.push({x,y,t:0,color:'160,197,229'});tone(320,.07,.035)}
function tone(f,d=.08,g=.04){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type='sine';osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(f*.66,t+d);gain.gain.setValueAtTime(g,t);gain.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+d+.01)}catch(e){sound=false;soundButton.textContent='DŹW. BRAK';soundButton.setAttribute('aria-pressed','false')}}

 for(const s of pointerState.values()){if(s.m)continue;const dx=s.x-x,dy=s.y-y,r2=dx*dx+dy*dy+1100,scale=2600000/(r2*Math.sqrt(r2));fx+=dx*scale;fy+=dy*scale}
 return {x:fx,y:fy}}
function recordMotion(s,x,y,t){
 if(!Number.isFinite(t))return;
 const samples=s.motion,last=samples[samples.length-1];
 if(last&&t<=last.t){if(t===last.t){last.x=x;last.y=y}return}

 // the finger stayed still and then accelerated during the final 50 ms.

function recordPointerEvent(s,e){

  const t=Math.abs(item.timeStamp-now)<1000?item.timeStamp:now;

 }
 const p=point(e),t=Math.abs(e.timeStamp-now)<1000?e.timeStamp:now;

function recentVelocity(s,now){
 const samples=s.motion;

 // displacement over the *actual* gap; never invent a late acceleration.
 // This is deliberately conservative when the browser drops events.

   if(count<16){for(const p of particles){if(count>=16)break;if(p.capture!==undefined)continue;

   }s.captured=count;}
 }

 for(const p of particles){if(p.capture!==undefined){const s=pointerState.get(p.capture);
   if(s){const tx=s.x+p.ox,ty=s.y+p.oy;
    p.vx+=(110*(tx-p.x)-17*p.vx)*dt;p.vy+=(110*(ty-p.y)-17*p.vy)*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(frames%2===0){p.trail.push({x:p.x,y:p.y});if(p.trail.length>18)p.trail.shift()}continue;
   }delete p.capture;}

  // No speed cliff: a 119 px/s gesture cannot behave radically unlike 121 px/s.

  const speed=Math.hypot(p.vx,p.vy);if(speed>690){p.vx*=690/speed;p.vy*=690/speed}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.age+=dt;
  const margin=5;if(p.x<margin){p.x=margin;p.vx=Math.abs(p.vx)*.78}else if(p.x>W-margin){p.x=W-margin;p.vx=-Math.abs(p.vx)*.78}
  if(p.y<margin){p.y=margin;p.vy=Math.abs(p.vy)*.78}else if(p.y>H-margin){p.y=H-margin;p.vy=-Math.abs(p.vy)*.78}
  for(const m of magnets){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy),min=26+p.r;if(d<min&&d>.001){const nx=dx/d,ny=dy/d,radial=p.vx*nx+p.vy*ny;p.x=m.x+nx*min;p.y=m.y+ny*min;if(radial<0){p.vx-=(1.4*radial)*nx;p.vy-=(1.4*radial)*ny}}}

 }
 for(const r of ripples)r.t+=dt;ripples=ripples.filter(r=>r.t<.65)
}
function draw(){ctx.fillStyle='#080e1b';ctx.fillRect(0,0,W,H);

 for(const p of particles){if(p.trail.length>1){ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);for(let i=1;i<p.trail.length;i++)ctx.lineTo(p.trail[i].x,p.trail[i].y);ctx.lineTo(p.x,p.y);ctx.lineWidth=1.2+p.r*.22;ctx.strokeStyle=p.hue>.5?'rgba(255,199,126,.28)':'rgba(127,224,244,.27)';ctx.stroke()}}
 for(const m of magnets){const rgb=palette[m.polarity>0?'plus':'minus'],c=rgb.join(','),radius=26+m.pulse*7;
  const aura=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,85+m.pulse*22);aura.addColorStop(0,`rgba(${c},.16)`);aura.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=aura;ctx.beginPath();ctx.arc(m.x,m.y,85+m.pulse*22,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(m.x,m.y,radius+8,0,Math.PI*2);ctx.lineWidth=1;ctx.strokeStyle=`rgba(${c},.25)`;ctx.stroke();
  ctx.beginPath();ctx.arc(m.x,m.y,radius,0,Math.PI*2);ctx.fillStyle='#152338';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=`rgb(${c})`;ctx.stroke();
  ctx.lineCap='round';ctx.strokeStyle=`rgb(${c})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(m.x-7,m.y);ctx.lineTo(m.x+7,m.y);if(m.polarity>0){ctx.moveTo(m.x,m.y-7);ctx.lineTo(m.x,m.y+7)}ctx.stroke();
 }
 for(const p of particles){const color=p.hue>.5?'255,200,129':'147,233,250';const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);glow.addColorStop(0,`rgba(${color},.6)`);glow.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,p.r*5,0,Math.PI*2);ctx.fill();ctx.fillStyle=`rgb(${color})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
 for(const s of pointerState.values()){
  if(s.m)continue;
  ctx.save();const glow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,78);glow.addColorStop(0,'rgba(175,255,206,.25)');glow.addColorStop(1,'rgba(175,255,206,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(s.x,s.y,78,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(169,255,211,.8)';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(s.x,s.y,24+(s.captured||0)*.65,0,Math.PI*2);ctx.stroke();
  if(s.mode==='pending'){ctx.strokeStyle='rgba(235,255,238,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,30,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(s.held/.23,0,1));ctx.stroke()}

  if(s.captured){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(195,255,217,.95)';ctx.fillText(String(s.captured),s.x,s.y-37)}ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fillStyle='rgba(169,255,211,.9)';ctx.fill();ctx.restore();

  if(len<1)continue;
  ctx.save();ctx.strokeStyle='rgba(255,238,195,.72)';ctx.fillStyle='rgba(255,238,195,.85)';
  ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(s.startX,s.startY);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.setLineDash([]);
  const a=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-Math.cos(a-.5)*13,s.y-Math.sin(a-.5)*13);ctx.lineTo(s.x-Math.cos(a+.5)*13,s.y-Math.sin(a+.5)*13);ctx.closePath();ctx.fill();ctx.restore();

}
function point(e){const b=canvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}

 else{pointerState.set(e.pointerId,{m:null,x:p.x,y:p.y,startX:p.x,startY:p.y,moved:false,held:0,captured:0,motion:[{x:p.x,y:p.y,t:performance.now()}],mode:'pending',id:e.pointerId})}
},{passive:false});

  // the last moving segment's speed.

 }

window.addEventListener('resize',resize);
